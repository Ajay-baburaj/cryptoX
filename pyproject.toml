[project]
name = "delta-crypto-bot"
version = "0.1.0"
description = "Local paper trading bot using Delta Exchange public market data"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4",
  "pandas>=2.2",
  "pyarrow>=18",
  "duckdb>=1.1",
  "websockets>=13",
  "aiohttp>=3.10",
  "backtesting>=0.6",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "loguru>=0.7",
  "google-auth>=2.30",
  "requests>=2.31",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

