<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e13">
<title>Sign in · CryptoX</title>
<style>
:root{color-scheme:dark;--bg:#0b0e13;--panel:#11151c;--line:#222833;--muted:#858d9c;--text:#eef1f6;--red:#ff7283;--violet:#9c83ff}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(640px 420px at 50% -10%,#3a2e7a3d,transparent 70%),
    radial-gradient(520px 360px at 85% 100%,#1f3a3326,transparent 65%),
    var(--bg);
  color:var(--text);font:14px 'DM Sans',system-ui,sans-serif;
}
.card{width:100%;max-width:378px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;text-align:center}
.brand-logo{height:30px;width:auto;color:#cabfff;filter:drop-shadow(0 4px 18px #7558e659)}
.brand small{color:#808a9c;font:500 9px 'DM Mono',monospace;letter-spacing:2.2px}
form{
  background:linear-gradient(180deg,#141924,var(--panel));
  border:1px solid var(--line);border-radius:14px;padding:30px 26px 26px;
  box-shadow:0 24px 60px -24px #000000b3,0 0 0 1px #ffffff05 inset;
}
h1{font-size:16px;margin:0 0 5px;letter-spacing:-.3px;font-weight:700}
p{margin:0 0 6px;color:var(--muted);font-size:12px;line-height:1.5}
label{display:block;font-size:11px;color:var(--muted);margin:16px 0 6px;font-weight:500}
input{
  width:100%;padding:11px 12px;background:#0b0e13;border:1px solid var(--line);
  border-radius:8px;color:var(--text);font-size:14px;transition:border-color .15s,box-shadow .15s;
}
input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px #9c83ff26}
button{
  width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;cursor:pointer;
  background:linear-gradient(140deg,#8e70ff,#5c42d8);color:#fff;font-weight:700;font-size:14px;
  box-shadow:0 10px 26px -10px #6a4ce580;transition:filter .15s,transform .15s;
}
button:hover:not(:disabled){filter:brightness(1.08)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.6;cursor:wait}
#error{margin-top:14px;color:var(--red);font-size:12px;min-height:1em}
.foot-note{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;color:#5f6876;font-size:10px}
.foot-note i{width:6px;height:6px;border-radius:50%;background:#46ca91;display:inline-block}
</style>
<script src="/runtime-config.js"></script>
<script src="/runtime.js"></script>
</head>
